[package]
name = "recall"
version = "0.1.0"
description = "Recall: your private AI memory. Everything searchable. Nothing uploaded."
authors = ["Recall contributors"]
license = "MIT"
edition = "2021"
# Oldest Rust version known to build Recall (uses Option::is_none_or).
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "recall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
thiserror = "2.0.21"
dunce = "1.0.5"
walkdir = "2.5.0"
sha2 = "0.11.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
pdf-extract = "0.12.1"
zip = { version = "5.0.1", default-features = false, features = ["deflate"] }
quick-xml = "0.41.0"
ocrs = "0.13"
rten = "0.26"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp"] }
notify = "8"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# Note: no `panic = "abort"`. Parsing libraries can panic on malformed files;
# unwinding lets Recall catch that and mark just that one file as unreadable.
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# Optimise all third-party crates even in `tauri dev` builds. Hashing, SQLite
# and the OCR engine are very slow unoptimised (ocrs's docs warn about this);
# Recall's own code stays quick to compile.
[profile.dev.package."*"]
opt-level = 3
