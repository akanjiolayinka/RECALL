# Runs on every push: checks that everything passes, and builds the Windows
# installer. The installer appears under the run's "Artifacts" on GitHub.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older, unfinished run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and privacy audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri's Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Frontend type-check and build
        run: npm run build
      # Tauri's build script checks that bundled resources exist.
      - name: Download the OCR models (checksums verified)
        run: npm run download-models

      - name: Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Rust lints
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

      - name: Privacy audit
        run: npm run audit:privacy

      # The embedding model is published on Hugging Face, which the
      # development environment can't reach but GitHub's runners can. Until its
      # checksums are pinned in scripts/download-models.mjs, this fetches the
      # current revision and prints what docs/MODELS.md must record.
      - name: Fetch the embedding model (BAAI/bge-small-en-v1.5)
        run: |
          set -euo pipefail
          repo=BAAI/bge-small-en-v1.5
          curl -sSfL "https://huggingface.co/api/models/$repo" -o hf-model.json
          python3 - <<'PY'
          import json
          info = json.load(open("hf-model.json"))
          print("revision:", info["sha"])
          print("licence (model card):", info.get("cardData", {}).get("license"))
          print("files:", [s["rfilename"] for s in info["siblings"]])
          PY
          rev=$(python3 -c 'import json; print(json.load(open("hf-model.json"))["sha"])')
          echo "BGE_REVISION=$rev" >> "$GITHUB_ENV"
          dir=models/bge-small-en-v1.5
          mkdir -p "$dir"
          for f in onnx/model.onnx tokenizer.json config.json; do
            curl -sSfL "https://huggingface.co/$repo/resolve/$rev/$f" -o "$dir/$(basename "$f")"
          done
          ls -l "$dir"
          sha256sum "$dir"/*
          cat "$dir/config.json"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Count the embedding model's parameters (onnx package)
        continue-on-error: true
        run: |
          pip install --quiet onnx
          python3 - <<'PY'
          import math, onnx
          model = onnx.load("models/bge-small-en-v1.5/model.onnx")
          print("opset:", [(o.domain, o.version) for o in model.opset_import])
          print("inputs:", [i.name for i in model.graph.input])
          print("outputs:", [o.name for o in model.graph.output])
          params = sum(math.prod(t.dims) for t in model.graph.initializer)
          print("parameters (initializers):", params)
          PY

      # The official implementation's vectors, for the Rust test that checks
      # Recall's own inference code gives the same results.
      - name: Reference vectors (sentence-transformers)
        continue-on-error: true
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet sentence-transformers
          python scripts/bge_reference.py "$BGE_REVISION" models/bge-small-en-v1.5/reference.json

      # The tests that need real model files: OCR on the sample receipt,
      # BGE's parameter count and similarity checks, and meaning-based search
      # over test-data/.
      - name: Real-model tests
        run: cargo test -- --ignored --nocapture
        working-directory: src-tauri
        env:
          RECALL_MODELS_DIR: ${{ github.workspace }}/models

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Downloads and checksum-verifies the OCR models (bundled into the
      # installer), then runs `tauri build`.
      - name: Build the installer
        run: npm run build:app

      - uses: actions/upload-artifact@v4
        with:
          name: Recall-Windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
